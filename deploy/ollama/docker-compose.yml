# Schematic's Ollama. This server runs one application at a time, so it gets the whole
# machine (no CPU/memory caps). No GPU here; Ollama runs on CPU.
name: schematic
services:
  ollama:
    image: ollama/ollama:latest
    container_name: schematic-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"   # localhost only; reach it through an SSH tunnel
    environment:
      OLLAMA_NUM_PARALLEL: "1"     # the pipeline makes one request at a time
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - schematic_ollama_data:/root/.ollama
volumes:
  schematic_ollama_data:
